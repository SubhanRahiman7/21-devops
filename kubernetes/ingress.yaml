apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-tracker
  namespace: task-tracker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: tasks.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-tracker
                port:
                  number: 80
