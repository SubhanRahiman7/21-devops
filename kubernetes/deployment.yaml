apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  namespace: task-tracker
  labels:
    app: task-tracker
    app.kubernetes.io/part-of: devops-task-tracker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: task-tracker
  template:
    metadata:
      labels:
        app: task-tracker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001                       # makes the mounted volume writable for the app user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/subhanrahiman7/devops-task-tracker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: task-tracker-config    # APP_ENV, LOG_LEVEL
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret  # sensitive value
                  key: API_TOKEN
            - name: APP_VERSION
              value: "1.0.0"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name   # shown in the UI so load balancing is visible
          startupProbe:                      # gives the app time to start before the other probes begin
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:                    # only Ready pods receive traffic
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:                     # restart the container if it stops answering
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data               # SQLite database (persistent)
            - name: tmp
              mountPath: /tmp                # gunicorn scratch space (root filesystem is read-only)
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: task-tracker-data
        - name: tmp
          emptyDir: {}
