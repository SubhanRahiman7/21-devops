{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-tracker.secretName" . }}
  labels: {{- include "task-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_TOKEN: {{ required "secret.apiToken is required when secret.create=true" .Values.secret.apiToken | quote }}
{{- end }}
