# Applied ONCE by hand (kubectl apply -f). It tells Argo CD where the desired state lives in Git.
# It lives outside the synced path so that Argo CD does not manage itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-tracker-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SubhanRahiman7/21-devops.git
    targetRevision: main
    path: helm/task-tracker                     # the Helm chart
    helm:
      valueFiles:
        - ../../gitops/environments/dev/values.yaml   # the environment's desired state
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true          # delete resources that were removed from Git
      selfHeal: true       # revert manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
